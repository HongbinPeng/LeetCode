<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <style>
    :root { color-scheme: light; --paper: #f6f4ec; --ink: #324a42; --muted: #849087; --accent: #d7784d; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .page { width: min(1160px, calc(100% - 88px)); margin: auto; padding: 33px 0 24px; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding-bottom: 20px; border-bottom: 1px solid #324a4226; }
    .brand { display: flex; gap: 10px; align-items: center; font-size: 12px; letter-spacing: 2px; font-weight: 650; }
    .brand svg { width: 30px; height: 23px; }
    .edition { font-size: 10px; letter-spacing: 2px; color: #788278; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; margin: 32px 0 24px; gap: 24px; }
    .eyebrow { margin: 0 0 12px; color: #849086; font-size: 10px; font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 0; font-family: "STKaiti", "KaiTi", "Noto Serif CJK SC", "Microsoft YaHei", serif; font-size: clamp(29px, 4.4vw, 48px); font-weight: 500; letter-spacing: 4px; line-height: 1.3; }
    h1 span { color: var(--accent); }
    .intro-note { margin: 0 0 5px; color: #7f897f; font-size: 12px; line-height: 1.9; text-align: right; letter-spacing: 1px; }
    .scene-wrap { position: relative; overflow: hidden; border: 1px solid #dce1d3; border-radius: 18px; background: #eaf0de; }
    .scene-label { position: absolute; z-index: 1; top: 25px; left: 28px; display: flex; align-items: center; gap: 9px; color: #637b68; font-size: 10px; letter-spacing: 2px; pointer-events: none; }
    .scene-label::before { content: ""; height: 6px; width: 6px; border-radius: 50%; background: #8aa67a; }
    .scene-number { position: absolute; top: 24px; right: 28px; color: #7c9071; font-size: 11px; letter-spacing: 2px; }
    #scene { display: block; width: 100%; height: auto; }
    .ride-caption { position: absolute; bottom: 23px; left: 28px; font-size: 10px; color: #82927a; letter-spacing: 3px; }
    .scene-signature { position: absolute; right: 28px; bottom: 21px; color: #7c9071; font-family: Georgia, serif; font-size: 17px; font-style: italic; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 18px; padding: 20px 2px; border-bottom: 1px solid #324a4226; }
    .playback { display: flex; align-items: center; gap: 13px; }
    .play { display: grid; place-items: center; width: 43px; height: 43px; background: var(--ink); color: var(--paper); border: 0; border-radius: 50%; cursor: pointer; transition: background .15s, transform .15s; }
    .play:hover { background: #496659; transform: translateY(-1px); }
    .play svg { width: 16px; height: 16px; }
    .status { display: block; font-size: 12px; letter-spacing: 1px; }
    .hint { display: block; margin-top: 5px; color: #91998f; font-size: 9px; letter-spacing: 1px; }
    .speed { display: flex; align-items: center; gap: 13px; }
    .speed-label { font-size: 10px; color: #8a9388; letter-spacing: 1px; }
    .speed-group { display: flex; padding: 4px; gap: 3px; border: 1px solid #dce0d5; border-radius: 28px; }
    .speed-group button { min-width: 54px; padding: 7px 12px; border: 0; border-radius: 20px; background: transparent; color: #8b948a; font-size: 11px; cursor: pointer; transition: background .15s, color .15s; }
    .speed-group button[aria-pressed="true"] { background: #e0e7d8; color: #455e49; }
    .speed-group button:hover { color: #324a42; background: #e9ecdf; }
    footer { display: flex; justify-content: space-between; gap: 14px; margin-top: 20px; color: #90978b; font-size: 10px; letter-spacing: 1px; }
    footer span:last-child { font-family: Georgia, serif; font-style: italic; letter-spacing: .5px; }
    .paused-mark { opacity: 0; transition: opacity .15s; }
    [data-paused="true"] .paused-mark { opacity: 1; }
    @media (min-width: 1600px) { .page { padding-top: 50px; } .intro { margin-top: 42px; } }
    @media (max-width: 640px) {
      .page { width: calc(100% - 32px); padding-top: 21px; }
      .brand { font-size: 9px; letter-spacing: 1.5px; } .edition { font-size: 8px; letter-spacing: 1px; }
      .intro { display: block; margin: 26px 0 20px; } .intro-note { text-align: left; margin: 13px 0 0; font-size: 11px; } .intro-note br { display: none; }
      .eyebrow { font-size: 8px; } h1 { letter-spacing: 2px; }
      .scene-wrap { border-radius: 13px; } #scene { width: 150%; max-width: none; margin-left: -25%; }
      .scene-label { top: 15px; left: 15px; font-size: 8px; letter-spacing: 1px; } .scene-number { top: 14px; right: 15px; font-size: 9px; }
      .ride-caption { left: 15px; bottom: 13px; font-size: 7px; letter-spacing: 1px; } .scene-signature { right: 15px; bottom: 11px; font-size: 12px; }
      .controls { gap: 10px; padding: 16px 0; } .speed { gap: 0; } .speed-label { display: none; } .speed-group button { min-width: 41px; padding: 7px 8px; }
      .status { font-size: 11px; } .hint { font-size: 8px; } .playback { gap: 9px; } .play { width: 38px; height: 38px; }
      footer { font-size: 8px; line-height: 1.7; } footer span:last-child { text-align: right; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = (identifier) => document.getElementById(identifier);
      const scene = byId('scene');
      const playToggle = byId('play-toggle');
      const playIcon = byId('play-icon');
      const status = byId('status');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const parts = Object.fromEntries(['rear-spokes', 'front-spokes', 'crank-arms', 'far-pedal', 'near-pedal', 'far-leg-path', 'near-leg-path', 'far-foot', 'near-foot', 'rider', 'clouds', 'hills', 'plants', 'rear-plants', 'road-marks', 'water', 'scarf-tail', 'scarf-short', 'eye', 'wind-streaks', 'bike-shadow', 'sky-bird-one', 'sky-bird-two'].map(identifier => [identifier, byId(identifier)]));
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTimestamp = null;
      let animationFrame = null;

      function drawLeg(side, angle, bob) {
        const pedalX = 592 + Math.cos(angle) * 22;
        const pedalY = 419 + Math.sin(angle) * 22;
        const hipX = side === 'near' ? 548 : 539;
        const hipY = 308 + bob;
        const thighLength = 81;
        const shinLength = 78;
        const deltaX = pedalX - hipX;
        const deltaY = pedalY - 6 - hipY;
        const distance = Math.hypot(deltaX, deltaY);
        const along = (thighLength ** 2 - shinLength ** 2 + distance ** 2) / (2 * distance);
        const perpendicular = Math.sqrt(Math.max(0, thighLength ** 2 - along ** 2));
        const kneeX = hipX + along * deltaX / distance + perpendicular * deltaY / distance;
        const kneeY = hipY + along * deltaY / distance - perpendicular * deltaX / distance;
        parts[`${side}-leg-path`].setAttribute('d', `M${hipX} ${hipY} L${kneeX} ${kneeY} L${pedalX} ${pedalY - 6}`);
        parts[`${side}-foot`].setAttribute('d', `M${pedalX - 3} ${pedalY - 10} Q${pedalX + 5} ${pedalY - 7} ${pedalX + 18} ${pedalY - 4} L${pedalX + 13} ${pedalY - 1} L${pedalX + 5} ${pedalY - 3} L${pedalX - 1} ${pedalY - 1} L${pedalX - 8} ${pedalY - 3}Z`);
        parts[`${side}-pedal`].setAttribute('transform', `translate(${pedalX} ${pedalY})`);
      }

      function render(time) {
        const phase = time * Math.PI * 1.25;
        const degrees = phase * 180 / Math.PI;
        const bob = Math.sin(phase * 2) * 1.6;
        parts['rear-spokes'].setAttribute('transform', `rotate(${degrees * 2.15})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${degrees * 2.15})`);
        parts['crank-arms'].setAttribute('transform', `rotate(${degrees} 592 419)`);
        parts.rider.setAttribute('transform', `translate(0 ${bob})`);
        drawLeg('far', phase + Math.PI, bob);
        drawLeg('near', phase, bob);
        parts.clouds.setAttribute('transform', `translate(${-((time * 5) % 1200)} 0)`);
        parts.hills.setAttribute('transform', `translate(${-((time * 10) % 1200)} 0)`);
        parts.plants.setAttribute('transform', `translate(${-((time * 74) % 1200)} 0)`);
        parts['rear-plants'].setAttribute('transform', `translate(${-((time * 43) % 1200)} 0)`);
        parts['road-marks'].setAttribute('transform', `translate(${-((time * 74) % 86)} 0)`);
        parts.water.setAttribute('opacity', String(.54 + Math.sin(time * 1.3) * .13));
        parts['scarf-tail'].setAttribute('d', `M618 202Q576 ${182 + Math.sin(phase * 1.6) * 6} 553 ${197 + Math.sin(phase * 1.6 + 1) * 7}L539 ${209 + Math.sin(phase * 1.6 + 1.5) * 7} 565 ${211 + Math.sin(phase * 1.6 + 1) * 5}Q585 ${202 + Math.sin(phase * 1.6) * 6} 615 217Z`);
        parts['scarf-short'].setAttribute('transform', `rotate(${Math.sin(phase * 1.6 + .5) * 5} 620 208)`);
        const eyeScale = time % 5.3 > 5.13 ? .12 : 1;
        parts.eye.setAttribute('transform', `translate(673 133) scale(1 ${eyeScale}) translate(-673 -133)`);
        parts['wind-streaks'].setAttribute('transform', `translate(${-Math.sin(time * 2) * 6} 0)`);
        parts['wind-streaks'].setAttribute('opacity', String(.4 + Math.sin(time * 2) * .2));
        parts['bike-shadow'].setAttribute('rx', String(207 + bob * 2));
        const birdLift = Math.sin(time * 2.7) * 3;
        parts['sky-bird-one'].setAttribute('d', `M827 79q7 ${-8 + birdLift} 14 0 7 ${-8 + birdLift} 14 0`);
        parts['sky-bird-two'].setAttribute('d', `M866 101q5 ${-6 - birdLift} 10 0 5 ${-6 - birdLift} 10 0`);
      }

      function tick(timestamp) {
        animationFrame = null;
        if (!playing || document.hidden) return;
        if (previousTimestamp !== null) elapsed += Math.min((timestamp - previousTimestamp) / 1000, .05) * speed;
        previousTimestamp = timestamp;
        render(elapsed);
        animationFrame = requestAnimationFrame(tick);
      }

      function schedule() {
        previousTimestamp = null;
        if (animationFrame !== null) cancelAnimationFrame(animationFrame);
        animationFrame = playing && !document.hidden ? requestAnimationFrame(tick) : null;
      }

      function updatePlayback() {
        scene.dataset.paused = String(!playing);
        playToggle.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        playToggle.setAttribute('aria-pressed', String(!playing));
        playIcon.setAttribute('d', playing ? 'M5 3h3v14H5zM12 3h3v14h-3z' : 'M6 2.5 17 10 6 17.5Z');
        status.textContent = playing ? '正在兜风' : '停下来，看看风景';
        schedule();
      }

      playToggle.addEventListener('click', () => { playing = !playing; updatePlayback(); });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('button, input, textarea, select, a, [contenteditable]')) return;
        event.preventDefault();
        playing = !playing;
        updatePlayback();
      });
      speedButtons.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach(candidate => candidate.setAttribute('aria-pressed', String(candidate === button)));
      }));
      reducedMotion.addEventListener('change', event => {
        if (event.matches) { playing = false; updatePlayback(); }
      });
      document.addEventListener('visibilitychange', schedule);
      render(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
